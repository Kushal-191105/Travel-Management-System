<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Bookings — TravelX</title>

  <style>
    /* ---------- Header styles (from Travel & Tour header) ---------- */
    /* Reset & base for header area */
    * { box-sizing: border-box; }
    :root{
      --teal:#008080;
      --teal-dark:#006666;
      --muted:#666;
      --card-bg: rgba(255,255,255,0.95);
      --soft:#e0f7f7;
      --shadow: 0 2px 6px rgba(0,0,0,0.12);
      --max-width: 1200px;
      --radius:12px;
    }

    /* make header full-bleed by removing default body margin */
    html,body{height:100%;margin:0;padding:0;}
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', Helvetica, Arial, sans-serif;
      background-color: #f6fbfb; /* page background */
      color: #142;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.4;
    }

    header {
      background-color: var(--teal);
      padding: 12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:white;
      position:sticky;
      top:0;
      z-index:40;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .logo { font-size:1.4rem; font-weight:700; letter-spacing:0.4px; }
    nav { display:flex; align-items:center; gap:18px; }
    nav ul { list-style:none; display:flex; gap:12px; align-items:center; margin:0; padding:0; }
    nav a { color:white; text-decoration:none; padding:8px 10px; border-radius:6px; font-weight:600; font-size:0.95rem; }
    nav a.active, nav a:hover { background:var(--teal-dark); }
    .hamburger {
      display:none;
      width:42px; height:42px; border-radius:8px; background:transparent; border:none; color:white;
      align-items:center; justify-content:center; cursor:pointer;
    }

    /* Responsive adjustments for header */
    @media (max-width:720px){
      nav ul { display:none; position:fixed; top:64px; right:14px; background:white; color:#222; padding:12px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border-radius:10px; flex-direction:column; width:220px; }
      nav ul.show { display:flex; }
      .hamburger { display:flex; }
      header { padding:10px 12px; }
      .logo { font-size:1.1rem; }
    }

    /* ---------- My Bookings page styles (kept mostly intact) ---------- */
    :root{--card:#fff;--radius:10px;--shadow-main:0 8px 30px rgba(0,0,0,0.08);--max-width-2:1100px}
    /* Move page spacing into .wrap so header remains full width */
    .wrap{max-width:1100px;margin:18px auto;padding:0 14px}
    .card{background:var(--card);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow-main)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    input,select{padding:8px;border-radius:8px;border:1px solid #e6eef0}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:10px;border-bottom:1px solid #eef3f3;text-align:left;font-size:14px}
    th{background:linear-gradient(90deg,#f7fffd,#f0f9f9);font-weight:700;color:var(--teal)}
    .muted{color:var(--muted);font-size:0.95rem}
    .btn{background:var(--teal);color:#fff;padding:8px 10px;border-radius:8px;border:none;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--teal);border:1px solid rgba(0,128,128,0.12)}
    .small{font-size:13px;padding:6px 8px}
    .center{text-align:center}
    .actions button{margin-right:6px}
    /* modal */
    .modal-back{position:fixed;inset:0;background:rgba(2,10,10,0.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
    .modal{background:#fff;padding:16px;border-radius:12px;max-width:720px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,0.25)}
    @media (max-width:820px){th,td{font-size:13px}}
    /* responsive cards on small screens */
    @media (max-width:820px){
      table, thead, tbody, th, td, tr { display:block; width:100%; }
      thead { display:none; }
      tr { margin-bottom:12px; background:var(--card); border-radius:8px; padding:10px; box-shadow:var(--shadow-main); }
      td { padding:6px 0; border-bottom:none; }
      td .label { color:var(--muted); font-size:12px; display:block; margin-bottom:6px; }
    }
  </style>
</head>
<body>

  <!-- Header (full width now) -->
  <header>
    <div class="logo">TravelX</div>

    <nav aria-label="Main Navigation">
      <button class="hamburger" aria-expanded="false" aria-label="Open menu" id="hamburger">
        <svg width="20" height="14" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="24" height="2" y="0" rx="1" fill="white"/>
          <rect width="24" height="2" y="8" rx="1" fill="white"/>
          <rect width="24" height="2" y="16" rx="1" fill="white"/>
        </svg>
      </button>

      <ul id="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="tours.html">Tours</a></li>
        <li><a href="booking.html">Book</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="mybookings.html" class="active">My Bookings</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content (inset by .wrap) -->
  <div class="wrap" >
    <header style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">My Bookings</h2>
      
    </header>

    <div class="card">
      <div class="controls">
        <input id="searchInput" placeholder="Search by package, booking id or name" style="min-width:240px">
        <select id="statusFilter"><option value="">All status</option><option>Confirmed</option><option>Pending</option><option>Cancelled</option></select>
        <button id="refreshBtn" class="btn small">Refresh</button>
        <button id="exportCsvBtn" class="btn small">Export CSV</button>
        <button id="clearLocalBtn" class="btn small ghost">Clear bookings</button>
      </div>

      <div id="listArea">
        <div id="loading" class="muted">Loading bookings…</div>

        <table id="bookingsTable" class="hidden" aria-live="polite" role="table">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Booked on</th>
              <th>Package (date)</th>
              <th>Contact</th>
              <th>Travellers</th>
              <th>Total</th>
              <th class="center">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- details modal -->
  <div id="modalBack" class="modal-back" role="dialog" aria-hidden="true">
    <div class="modal" id="modal">
      <div id="modalContent"></div>
      <div style="text-align:right;margin-top:12px">
        <button id="modalClose" class="btn ghost small">Close</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------------- Header hamburger behaviour ---------------- */
    const hamburger = document.getElementById('hamburger');
    const navList = document.getElementById('nav-list');
    hamburger && hamburger.addEventListener('click', () => {
      const expanded = hamburger.getAttribute('aria-expanded') === 'true';
      hamburger.setAttribute('aria-expanded', String(!expanded));
      navList.classList.toggle('show');
    });

    // Close nav when clicking outside
    document.addEventListener('click', (e) => {
      if (navList && hamburger && !navList.contains(e.target) && !hamburger.contains(e.target) && navList.classList.contains('show')) {
        navList.classList.remove('show');
        hamburger.setAttribute('aria-expanded', 'false');
      }
    });

    /* ---------------- My Bookings logic ---------------- */
    (function(){
      const STORAGE_KEY = 'travelx_bookings';
      const tbody = document.getElementById('tbody');
      const bookingsTable = document.getElementById('bookingsTable');
      const loading = document.getElementById('loading');
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      const refreshBtn = document.getElementById('refreshBtn');
      const exportCsvBtn = document.getElementById('exportCsvBtn');
      const clearLocalBtn = document.getElementById('clearLocalBtn');
      const modalBack = document.getElementById('modalBack');
      const modalContent = document.getElementById('modalContent');
      const modalClose = document.getElementById('modalClose');

      let bookings = []; // normalized list shown to user
      const queryEmail = (new URLSearchParams(location.search)).get('email') || null;

      function showLoading(v){ loading.style.display = v ? 'block' : 'none'; }

      // parse and format a date-like value into readable string
      function formatDate(raw){
        if(!raw) return '—';
        try {
          const d = new Date(raw);
          if(!isNaN(d)) {
            const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
            return d.toLocaleString(undefined, opts);
          }
          return String(raw);
        } catch(e){
          return String(raw);
        }
      }

      // Normalize booking shape (includes bookedOn extraction)
      function normalizeBooking(b){
        const bookedRaw = b.bookedAt || b.booked_on || b.bookedOn || b.createdAt || b.created_at || b.bookingDate || b.booking_date || b.booked || null;
        return {
          id: b._id || b.id || b.bookingId || b.ref || ('local-'+(b.email||'guest')+'-'+Math.random().toString(36).slice(2,9)),
          bookedOn: bookedRaw || null,
          packageName: b.packageName || b.package || b.pkg || '—',
          travelDate: b.travelDate || b.date || 'TBD',
          perPerson: Number(b.perPerson || b.price || 0),
          total: Number(b.total || b.amount || (b.perPerson ? b.perPerson * ((b.travelers||[]).length || 0) : 0) || 0),
          contact: b.contact || { name: b.name || b.customerName || b.primaryName || '—', email: b.email || b.contactEmail || '', phone: b.phone || b.contactPhone || '' },
          travelers: b.travelers || b.travellers || [],
          status: (b.status || 'Pending'),
          raw: b
        };
      }

      // Attempt to fetch from backend (user-scoped) if possible, else fallback to localStorage
      async function loadBookings(){
        showLoading(true);
        bookings = [];
        // If email query provided, attempt backend fetch with email param
        try {
          if (queryEmail) {
            const resp = await fetch('/api/bookings?email=' + encodeURIComponent(queryEmail));
            if (resp.ok) {
              const data = await resp.json();
              const arr = Array.isArray(data) ? data : (Array.isArray(data.bookings) ? data.bookings : []);
              bookings = arr.map(normalizeBooking);
              renderList();
              showLoading(false);
              return;
            }
          }
        } catch(e){
          // ignore; fallback to local
        }

        // Try fetching user-specific bookings from /api/bookings (if API exists and supports current-user)
        try {
          const resp = await fetch('/api/bookings');
          if (resp.ok) {
            const data = await resp.json();
            const arr = Array.isArray(data) ? data : (Array.isArray(data.bookings) ? data.bookings : []);
            // if server returns all bookings, try to filter by provided email param (if present)
            let arrFiltered = arr;
            if (queryEmail) {
              arrFiltered = arr.filter(x => {
                const email = (x.email || (x.contact && x.contact.email) || '').toLowerCase();
                return email === queryEmail.toLowerCase();
              });
            }
            bookings = arrFiltered.map(normalizeBooking);
            renderList();
            showLoading(false);
            return;
          }
        } catch(e){
          // ignore
        }

        // Fallback localStorage
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          // if queryEmail present, filter local entries by email/contact email
          const arrFiltered = queryEmail ? arr.filter(x => {
            const email = (x.email || (x.contact && x.contact.email) || '').toLowerCase();
            return email === queryEmail.toLowerCase();
          }) : arr;
          bookings = arrFiltered.map(normalizeBooking);
        } catch (e) {
          bookings = [];
        } finally {
          renderList();
          showLoading(false);
        }
      }

      // Render bookings table or cards
      function renderList(){
        if (!bookings || !bookings.length) {
          bookingsTable.classList.add('hidden');
          tbody.innerHTML = '';
          return;
        }
        bookingsTable.classList.remove('hidden');

        const q = searchInput.value.trim().toLowerCase();
        const stFilter = statusFilter.value;

        const filtered = bookings.filter(b => {
          if (stFilter && String(b.status).toLowerCase() !== String(stFilter).toLowerCase()) return false;
          if (!q) return true;
          const hay = (b.id + ' ' + b.packageName + ' ' + (b.contact.name||'') + ' ' + (b.contact.email||'')).toLowerCase();
          return hay.includes(q);
        });

        tbody.innerHTML = filtered.map(b => {
          const travCount = (b.travelers && b.travelers.length) || 0;
          const total = b.total || (b.perPerson * travCount) || 0;
          return `<tr data-id="${escapeHtml(b.id)}">
            <td style="min-width:150px"><strong>${escapeHtml(b.id)}</strong></td>
            <td>${escapeHtml(formatDate(b.bookedOn))}</td>
            <td>${escapeHtml(b.packageName)} <div class="muted">${escapeHtml(b.travelDate)}</div></td>
            <td>${escapeHtml(b.contact.name || '—')}<div class="muted">${escapeHtml(b.contact.email||'')}${b.contact.phone ? ' • '+escapeHtml(b.contact.phone) : ''}</div></td>
            <td>${travCount}</td>
            <td>₹${Number(total).toLocaleString()}</td>
            <td class="center actions">
              <button class="btn small" data-action="view" data-id="${escapeHtml(b.id)}">View</button>
            </td>
          </tr>`;        }).join('');

        // attach view handlers
        tbody.querySelectorAll('button[data-action="view"]').forEach(btn=>{
          btn.addEventListener('click', (e)=>{
            const id = btn.dataset.id;
            const bk = bookings.find(x => String(x.id) === String(id));
            if (bk) showDetails(bk);
          });
        });
      }

      function showDetails(bk){
        const travList = (bk.travelers || []).map(t=>`<li>${escapeHtml(t.name || (t.fullName||t) )}${t.age ? ' ('+escapeHtml(String(t.age))+')' : ''}</li>`).join('') || '<li class="muted">—</li>';
        const total = bk.total || (bk.perPerson * ((bk.travelers||[]).length || 0)) || 0;
        const html = `
          <h3 style="margin:0 0 6px 0">${escapeHtml(bk.packageName)} <small class="muted">(${escapeHtml(bk.travelDate)})</small></h3>
          <div class="muted">Booking ID: <strong>${escapeHtml(bk.id)}</strong></div>
          <div class="muted">Booked on: <strong>${escapeHtml(formatDate(bk.bookedOn))}</strong></div>
          <hr>
          <div><strong>Contact</strong><div class="muted">${escapeHtml(bk.contact.name)} • ${escapeHtml(bk.contact.email)}${bk.contact.phone ? ' • '+escapeHtml(bk.contact.phone) : ''}</div></div>
          <hr>
          <div><strong>Travellers (${(bk.travelers||[]).length})</strong><ul style="margin-left:18px">${travList}</ul></div>
          <hr>
          <div><strong>Price</strong><div class="muted">Per person: ₹${Number(bk.perPerson||0).toLocaleString()} • Total: ₹${Number(total).toLocaleString()}</div></div>
          <hr>
          <div><strong>Status</strong><div class="muted">${escapeHtml(String(bk.status||'Pending'))}</div></div>
          <hr>
          <pre style="white-space:pre-wrap;background:#fbfeff;padding:10px;border-radius:8px;border:1px solid #eef7f7;max-height:260px;overflow:auto">${escapeHtml(JSON.stringify(bk.raw, null, 2))}</pre>
        `;
        modalContent.innerHTML = html;
        modalBack.style.display = 'flex';
        modalBack.setAttribute('aria-hidden','false');
      }

      modalClose.addEventListener('click', ()=>{ modalBack.style.display='none'; modalBack.setAttribute('aria-hidden','true'); });
      modalBack.addEventListener('click', e => { if(e.target === modalBack) modalClose.click(); });

      function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

      // Export CSV (visible filtered list) — includes bookedOn
      function exportCsv(){
        if (!bookings.length){ alert('No bookings to export'); return; }
        const rows = [['bookingId','bookedOn','package','travelDate','perPerson','total','contactName','contactEmail','contactPhone','travellers']];
        for(const b of bookings){
          rows.push([
            b.id,
            b.bookedOn || '',
            b.packageName,
            b.travelDate,
            b.perPerson || '',
            b.total || '',
            (b.contact && b.contact.name) || '',
            (b.contact && b.contact.email) || '',
            (b.contact && b.contact.phone) || '',
            (b.travelers || []).map(t => t.name || '').join('; ')
          ]);
        }
        const csv = rows.map(r => r.map(cell => `"${String(cell||'').replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `my_bookings_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      // Clear local bookings (confirmation text updated)
      function clearLocal(){
        if (!confirm('Remove local bookings saved in this browser?')) return;
        localStorage.removeItem(STORAGE_KEY);
        loadBookings();
      }

      // UI hooks
      searchInput.addEventListener('input', renderList);
      statusFilter.addEventListener('change', renderList);
      refreshBtn.addEventListener('click', loadBookings);
      exportCsvBtn.addEventListener('click', exportCsv);
      clearLocalBtn.addEventListener('click', clearLocal);

      // initial load
      loadBookings();
    })();
  </script>
</body>
</html>
