<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bookings — TravelX Admin</title>
  <style>
    :root{--teal:#008080;--muted:#666;--card:#fff;--radius:10px;--shadow:0 8px 30px rgba(0,0,0,0.08);max-width:1100px}
    *{box-sizing:border-box} body{font-family:Segoe UI,Roboto,Arial,sans-serif;margin:18px;background:#f6fbfb;color:#042}
    .wrap{max-width:1100px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .card{background:var(--card);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    input,select{padding:8px;border-radius:8px;border:1px solid #e6eef0}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:10px;border-bottom:1px solid #eef3f3;text-align:left;font-size:14px}
    th{background:linear-gradient(90deg,#f7fffd,#f0f9f9);font-weight:700;color:var(--teal)}
    .muted{color:var(--muted);font-size:0.95rem}
    .btn{background:var(--teal);color:#fff;padding:8px 10px;border-radius:8px;border:none;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--teal);border:1px solid rgba(0,128,128,0.12)}
    .small{font-size:13px;padding:6px 8px}
    .center{text-align:center}
    .actions button{margin-right:6px}
    .hidden{display:none}
    /* modal & auth overlay */
    .modal-back{position:fixed;inset:0;background:rgba(2,10,10,0.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
    .modal{background:#fff;padding:16px;border-radius:12px;max-width:720px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,0.25)}
    .auth-overlay{position:fixed;inset:0;background:linear-gradient(180deg, rgba(246,251,251,0.95), rgba(246,251,251,0.95));display:flex;align-items:center;justify-content:center;z-index:70}
    .auth-card{background:#fff;padding:20px;border-radius:12px;max-width:420px;width:100%;box-shadow:var(--shadow);text-align:center}
    .auth-card h3{margin-top:0}
    .auth-card input{width:100%;margin:8px 0}
    .auth-note{color:var(--muted);font-size:0.95rem;margin-top:6px}
    @media (max-width:820px){th,td{font-size:13px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h2>Bookings — Admin</h2>
      <div id="authActions" class="muted">
        <!-- Filled by JS -->
      </div>
    </header>

    <div class="card">
      <div class="controls">
        <input id="searchInput" placeholder="Search by name, email, package, booking id or booked date" style="min-width:260px">
        <select id="filterPackage"><option value="">All packages</option></select>
        <button id="refreshBtn" class="btn small">Refresh</button>
        <button id="exportCsvBtn" class="btn small">Export CSV</button>
        <button id="clearLocalBtn" class="btn small ghost">Clear bookings</button>
      </div>

      <div id="listArea">
        <div id="loading" class="muted">Loading bookings…</div>
        <table id="bookingsTable" class="hidden" aria-live="polite">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Booked on</th>
              <th>Package (date)</th>
              <th>Primary contact</th>
              <th>Travellers</th>
              <th>Total</th>
              <th class="center">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- details modal -->
  <div id="modalBack" class="modal-back" role="dialog" aria-hidden="true">
    <div class="modal" id="modal">
      <div id="modalContent"></div>
      <div style="text-align:right;margin-top:12px">
        <button id="modalClose" class="btn ghost small">Close</button>
      </div>
    </div>
  </div>

  <!-- auth overlay (shown when not signed in) -->
  <div id="authOverlay" class="auth-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="Sign in required">
    <div class="auth-card">
      <h3>Please sign in to continue</h3>
      <p class="auth-note">You must be signed in to view and manage bookings.</p>
      <input id="authEmail" type="email" placeholder="Email" autocomplete="username" />
      <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button id="signInBtn" class="btn">Sign in</button>
        <button id="closeOverlayBtn" class="btn ghost" style="display:none">Close</button>
      </div>
      <div id="authMessage" class="muted" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Firebase + app script -->
  <script type="module">
    // --- Firebase setup ---
    // Replace the firebaseConfig object with your Firebase project's config
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

   const firebaseConfig = {
  apiKey: "AIzaSyDNu41TJ0O9bvOiXox3M46bUBgOUHR26l0",
  authDomain: "webapp-1a2f5.firebaseapp.com",
  projectId: "webapp-1a2f5",
  storageBucket: "webapp-1a2f5.firebasestorage.app",
  messagingSenderId: "787382456441",
  appId: "1:787382456441:web:b262abaa100015503644a8",
  measurementId: "G-B4YFW98ZXH"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // --- DOM refs ---
    const tbody = document.getElementById('tbody');
    const bookingsTable = document.getElementById('bookingsTable');
    const loading = document.getElementById('loading');
    const searchInput = document.getElementById('searchInput');
    const filterPackage = document.getElementById('filterPackage');
    const refreshBtn = document.getElementById('refreshBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const clearLocalBtn = document.getElementById('clearLocalBtn');
    const modalBack = document.getElementById('modalBack');
    const modalContent = document.getElementById('modalContent');
    const modalClose = document.getElementById('modalClose');
    const authOverlay = document.getElementById('authOverlay');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const signInBtn = document.getElementById('signInBtn');
    const authMessage = document.getElementById('authMessage');
    const authActions = document.getElementById('authActions');

    const STORAGE_KEY = 'travelx_bookings';
    let bookings = []; // loaded bookings
    let currentUser = null;

    // --- Auth handlers ---
    onAuthStateChanged(auth, user => {
      currentUser = user;
      updateAuthUI();
      if(user){
        // signed in: load bookings
        loadBookings();
      } else {
        // signed out: clear list and show overlay
        bookings = [];
        renderList(); // will hide table
        showLoading(false);
        showAuthOverlay(true);
      }
    });

    function updateAuthUI(){
      if(currentUser){
        authActions.innerHTML = `<div style="display:flex;gap:8px;align-items:center">
          <div class="muted">Signed in as <strong>${escapeHtml(currentUser.email||currentUser.uid)}</strong></div>
          <button id="signOutBtn" class="btn small ghost">Sign out</button>
        </div>`;
        document.getElementById('signOutBtn').addEventListener('click', async ()=> {
          try { await signOut(auth); } catch(e){ alert('Sign out failed: '+e.message); }
        });
        showAuthOverlay(false);
      } else {
        authActions.innerHTML = `<div class="muted">Not signed in</div>`;
        showAuthOverlay(true);
      }
    }

    signInBtn.addEventListener('click', async ()=>{
      authMessage.textContent = '';
      const email = authEmail.value.trim();
      const pw = authPassword.value;
      if(!email || !pw){ authMessage.textContent = 'Please enter email and password.'; return; }
      signInBtn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email, pw);
        authEmail.value = '';
        authPassword.value = '';
        authMessage.textContent = '';
      } catch(err){
        // show only a short message to the user (no long Firebase error details)
        authMessage.textContent = 'Sign-in failed';
        // keep a console log for debugging if needed
        console.error('Sign-in error:', err);
      } finally { signInBtn.disabled = false; }
    });

    function showAuthOverlay(show){
      authOverlay.style.display = show ? 'flex' : 'none';
      // When overlay shown, hide bookings table and controls to prevent interaction
      if(show){
        bookingsTable.classList.add('hidden');
        document.querySelectorAll('.controls > *').forEach(el => el.setAttribute('disabled','true'));
      } else {
        document.querySelectorAll('.controls > *').forEach(el => el.removeAttribute('disabled'));
      }
    }

    // --- Bookings logic (unchanged core, but guarded by auth) ---
    async function loadBookings(){
      // Only load when signed in
      if(!currentUser) {
        showLoading(false);
        return;
      }
      showLoading(true);
      bookings = [];
      try {
        const resp = await fetch('/api/bookings');
        if(!resp.ok) throw new Error('no backend or server error');
        const data = await resp.json();
        if(Array.isArray(data)){
          bookings = data.map(normalizeBooking);
        } else {
          bookings = Array.isArray(data.bookings) ? data.bookings.map(normalizeBooking) : [];
        }
      } catch (e) {
        // fallback localStorage (still requires sign-in)
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          try { bookings = JSON.parse(raw).map(normalizeBooking); } catch(e){}
        } else {
          bookings = [];
        }
      } finally {
        renderList();
        showLoading(false);
      }
    }

    function normalizeBooking(b){
      const bookedRaw = b.bookedAt || b.booked_on || b.bookedOn || b.createdAt || b.created_at || b.bookingDate || b.booking_date || b.booked || null;
      return {
        id: b._id || b.id || b.bookingId || b.ref || (b.contact && b.contact.email ? 'demo-'+hashCode((b.contact.email||'') + Date.now()) : 'demo-'+Math.random().toString(36).slice(2,9)),
        bookedOn: bookedRaw || null,
        packageName: b.packageName || b.package || (b.pkg && b.pkg.name) || (b.packageNameFull) || '—',
        travelDate: b.travelDate || (b.packageDate) || 'TBD',
        days: b.days || b.nights || 1,
        perPerson: Number(b.perPerson || (b.price) || 0),
        total: Number(b.total || (b.perPerson && b.travellers ? b.perPerson * b.travellers.length : 0)) || Number(b.total || 0),
        contact: b.contact || {name: b.primaryName || b.contactName || '—', email: b.contactEmail || b.primaryEmail || '', phone: b.contactPhone || b.primaryPhone || ''},
        travelers: b.travelers || b.travellers || b.travelerList || [],
        raw: b
      };
    }

    function formatDate(raw){
      if(!raw) return '—';
      try {
        const d = new Date(raw);
        if(!isNaN(d)) {
          const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
          return d.toLocaleString(undefined, opts);
        }
        return String(raw);
      } catch(e){ return String(raw); }
    }

    function renderList(){
      // package filter
      const packages = Array.from(new Set(bookings.map(b=>b.packageName))).filter(Boolean).sort();
      filterPackage.innerHTML = '<option value="">All packages</option>' + packages.map(p=>`<option>${escapeHtml(p)}</option>`).join('');

      if(!bookings.length){
        bookingsTable.classList.add('hidden');
        tbody.innerHTML = '';
        return;
      }

      bookingsTable.classList.remove('hidden');
      const q = searchInput.value.trim().toLowerCase();
      const pkgFilter = filterPackage.value;

      const filtered = bookings.filter(b=>{
        if(pkgFilter && b.packageName !== pkgFilter) return false;
        if(!q) return true;
        const hay = (b.id+' '+b.packageName+' '+(b.contact.name||'')+' '+(b.contact.email||'')+' '+(b.travelers||[]).map(t=>t.name||'').join(' ')+' '+(b.bookedOn||'')).toLowerCase();
        return hay.includes(q);
      });

      tbody.innerHTML = filtered.map(b => {
        const travCount = (b.travelers && b.travelers.length) || 0;
        const total = b.total || (b.perPerson * travCount) || 0;
        return `<tr data-id="${escapeHtml(b.id)}">
          <td style="min-width:150px"><strong>${escapeHtml(b.id)}</strong></td>
          <td>${escapeHtml(formatDate(b.bookedOn))}</td>
          <td>${escapeHtml(b.packageName)} <div class="muted">${escapeHtml(b.travelDate)}</div></td>
          <td>${escapeHtml(b.contact.name || '—')}<div class="muted">${escapeHtml(b.contact.email||'')}${b.contact.phone ? ' • '+escapeHtml(b.contact.phone) : ''}</div></td>
          <td>${travCount}</td>
          <td>₹${Number(total).toLocaleString()}</td>
          <td class="center actions">
            <button class="btn small" data-action="view" data-id="${escapeHtml(b.id)}">View</button>
            <button class="btn ghost small" data-action="delete" data-id="${escapeHtml(b.id)}">Delete</button>
          </td>
        </tr>`;
      }).join('');

      // attach actions
      tbody.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const bk = bookings.find(x=>String(x.id)===String(id));
          if(!bk) return;
          if(action==='view') showDetails(bk);
          if(action==='delete') removeBooking(bk);
        });
      });
    }

    async function removeBooking(bk){
      if(!confirm('Delete booking ' + bk.id + '? This cannot be undone (demo fallback will also remove local copy).')) return;
      try {
        const resp = await fetch('/api/bookings/' + encodeURIComponent(bk.id), {method:'DELETE'});
        if(resp.ok){
          await loadBookings();
          return;
        }
      } catch(e){}
      // fallback: remove from localStorage
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const kept = raw.filter(r => (r._id||r.id||r.bookingId||r.ref) != bk.id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(kept));
      await loadBookings();
    }

    function showDetails(bk){
      const travList = (bk.travelers || []).map(t=>`<li>${escapeHtml(t.name || (t.fullName||t))}${t.age ? ' ('+escapeHtml(t.age)+')' : ''}</li>`).join('');
      const html = `
        <h3 style="margin:0 0 8px 0">${escapeHtml(bk.packageName)} <small class="muted">(${escapeHtml(bk.travelDate)})</small></h3>
        <div class="muted">Booking ID: <strong>${escapeHtml(bk.id)}</strong></div>
        <div class="muted">Booked on: <strong>${escapeHtml(formatDate(bk.bookedOn))}</strong></div>
        <hr>
        <div><strong>Primary contact</strong><div class="muted">${escapeHtml(bk.contact.name)} • ${escapeHtml(bk.contact.email)} • ${escapeHtml(bk.contact.phone)}</div></div>
        <hr>
        <div><strong>Travellers (${(bk.travelers||[]).length})</strong><ul>${travList || '<li class="muted">—</li>'}</ul></div>
        <hr>
        <div><strong>Totals</strong><div class="muted">Per person: ₹${Number(bk.perPerson||0).toLocaleString()} • Total: ₹${Number(bk.total|| (bk.perPerson*((bk.travelers||[]).length||0))).toLocaleString()}</div></div>
        <hr>
        <pre style="white-space:pre-wrap;background:#fbfeff;padding:10px;border-radius:8px;border:1px solid #eef7f7;max-height:220px;overflow:auto">${escapeHtml(JSON.stringify(bk.raw, null, 2))}</pre>
      `;
      modalContent.innerHTML = html;
      modalBack.style.display = 'flex';
      modalBack.setAttribute('aria-hidden','false');
    }

    modalClose.addEventListener('click', ()=>{ modalBack.style.display='none'; modalBack.setAttribute('aria-hidden','true') });
    modalBack.addEventListener('click', e => { if(e.target === modalBack) modalClose.click(); });

    function showLoading(v){ loading.style.display = v ? 'block' : 'none'; }

    // helpers
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
    function hashCode(s){ let h=0; for(let i=0;i<s.length;i++){ h = ((h<<5)-h)+s.charCodeAt(i); h |= 0; } return Math.abs(h).toString(36); }

    // CSV export
    function exportCsv(){
      const rows = [['bookingId','bookedOn','package','travelDate','days','perPerson','total','contactName','contactEmail','contactPhone','travellers']];
      for(const b of bookings){
        rows.push([
          b.id,
          b.bookedOn || '',
          b.packageName,
          b.travelDate,
          b.days,
          b.perPerson,
          b.total,
          b.contact.name || '',
          b.contact.email || '',
          b.contact.phone || '',
          (b.travelers || []).map(t=>t.name||'').join('; ')
        ]);
      }
      const csv = rows.map(r => r.map(cell => `"${String(cell||'').replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'travelx_bookings.csv'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    clearLocalBtn.addEventListener('click', ()=> {
      if(!confirm('Remove local bookings saved in browser storage?')) return;
      localStorage.removeItem(STORAGE_KEY);
      loadBookings();
    });

    // UI hooks
    searchInput.addEventListener('input', renderList);
    filterPackage.addEventListener('change', renderList);
    refreshBtn.addEventListener('click', loadBookings);
    exportCsvBtn.addEventListener('click', exportCsv);

    // initial UI state
    showLoading(true); // until auth check fires

  </script>
</body>
</html>
